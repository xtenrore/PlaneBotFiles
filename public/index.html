<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081d19">
<title>SahaNova Fantezi</title>
<style>
:root{--bg:#07130f;--panel:#0e211b;--panel2:#132b23;--line:#24463b;--text:#f4fbf7;--muted:#9eb7ad;--green:#39e58c;--green2:#12b76a;--yellow:#ffd35a;--red:#ff6b6b;--blue:#73b9ff;--shadow:0 18px 60px rgba(0,0,0,.32);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 80% -10%,#154733 0,transparent 35%),var(--bg);color:var(--text)}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(57,229,140,.45);outline-offset:2px}.hidden{display:none!important}
#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#06100d,#0a2118 55%,#0a3424);display:grid;place-items:center;padding:24px}.gate-card{width:min(680px,100%);padding:44px;border:1px solid #2b5947;border-radius:32px;background:rgba(9,28,21,.88);backdrop-filter:blur(18px);box-shadow:var(--shadow);text-align:center}.brandmark{width:84px;height:84px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;font-size:38px;font-weight:900;color:#062216;background:linear-gradient(145deg,#6cf2a9,#21cc75);box-shadow:0 18px 42px rgba(57,229,140,.22)}.gate-card h1{font-size:clamp(36px,8vw,72px);letter-spacing:-.055em;margin:0}.gate-card p{color:#bcd2c9;font-size:18px;line-height:1.6;max-width:540px;margin:14px auto 28px}.primary{border:0;border-radius:14px;background:linear-gradient(135deg,var(--green),#19c976);color:#052116;font-weight:900;padding:13px 18px;box-shadow:0 8px 24px rgba(57,229,140,.18)}.primary:hover{filter:brightness(1.07)}.ghost{border:1px solid var(--line);border-radius:13px;background:#10251e;color:var(--text);font-weight:750;padding:11px 14px}.danger{border:1px solid #703939;background:#321b1d;color:#ffd9d9;border-radius:12px;padding:10px 13px}.small{padding:8px 11px;font-size:13px}
.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;height:72px;display:flex;align-items:center;gap:18px;padding:0 24px;background:rgba(7,19,15,.9);backdrop-filter:blur(16px);border-bottom:1px solid #17362c}.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:950;white-space:nowrap}.logo i{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--green);color:#062116;display:grid;place-items:center}.desktop-nav{display:flex;gap:4px;flex:1;overflow:auto}.navbtn{border:0;background:transparent;color:#a7beb5;padding:10px 12px;border-radius:10px;font-weight:760;white-space:nowrap}.navbtn.active,.navbtn:hover{color:#fff;background:#17352b}.top-user{display:flex;align-items:center;gap:9px;padding-left:8px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#1c4738;font-weight:900;color:#8cffba}.shell{width:min(1400px,100%);margin:0 auto;padding:26px 24px 92px}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-bottom:20px}.hero-main,.card{border:1px solid #1e4034;background:linear-gradient(160deg,rgba(18,45,36,.95),rgba(11,29,23,.98));border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.18)}.hero-main{padding:26px;min-height:210px;position:relative;overflow:hidden}.hero-main:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-85px;background:radial-gradient(circle,#39e58c44,transparent 65%)}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:#7fe8ad;font-weight:900}.hero-main h1{margin:8px 0 7px;font-size:clamp(30px,5vw,56px);letter-spacing:-.045em}.hero-main p{color:var(--muted);max-width:620px;line-height:1.5}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hero-side{padding:22px}.hero-side h3{margin:0 0 14px}.deadline{font-size:27px;font-weight:950;color:var(--yellow)}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{padding:17px 18px}.stat b{display:block;font-size:26px;margin-top:5px}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:20px}.card h2,.card h3{margin:0 0 14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 18px}.section-head h1{margin:0;font-size:30px;letter-spacing:-.03em}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #315444;background:#132c24;color:#d8ebe2;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.pill.green{color:#7df0ae;border-color:#286a48;background:#103121}.pill.yellow{color:#ffe08b;border-color:#655529;background:#302b16}.pill.red{color:#ffaaaa;border-color:#6f3434;background:#351c1d}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #214035;border-radius:14px;background:#0e251d}.row-main{flex:1;min-width:0}.row-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-main small{display:block;color:var(--muted);margin-top:3px}.score{font-weight:950;font-size:20px}.money{color:#8ef3b7;font-weight:900}.delta-up{color:#62e59c}.delta-down{color:#ff9999}.empty{padding:28px;text-align:center;border:1px dashed #315043;border-radius:18px;color:#a8beb5}.pitch{background:linear-gradient(180deg,#147441,#105d35);border-radius:26px;padding:22px 14px;min-height:620px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);position:relative;overflow:hidden}.pitch:before{content:"";position:absolute;inset:50% 0 auto;border-top:2px solid rgba(255,255,255,.18)}.pitch:after{content:"";position:absolute;width:150px;height:150px;border:2px solid rgba(255,255,255,.15);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.pitch-line{position:relative;z-index:1;display:flex;justify-content:center;gap:10px;margin:16px auto}.player-chip{width:min(118px,20vw);border:0;background:transparent;color:white;padding:0}.shirt{height:62px;width:66px;margin:auto;clip-path:polygon(23% 0,39% 10%,61% 10%,77% 0,100% 21%,84% 37%,78% 28%,78% 100%,22% 100%,22% 28%,16% 37%,0 21%);background:linear-gradient(145deg,#fff,#c7f3dc);color:#0c3b28;display:grid;place-items:center;font-weight:950}.player-chip.captain .shirt{box-shadow:0 0 0 3px #ffe16c}.pname{background:#092b1d;color:#fff;border-radius:8px;padding:5px 6px;margin-top:5px;font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pmeta{text-align:center;font-size:10px;color:#cce8da;margin-top:3px}.bench{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.bench .row{padding:9px}.bench-badge{background:#2c392f;padding:5px 7px;border-radius:8px;font-size:10px;font-weight:900}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#8da99e;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:10px;border-bottom:1px solid #244239}.table td{padding:12px 10px;border-bottom:1px solid #19352c}.table tr:last-child td{border-bottom:0}.rank{font-weight:950;color:#79efac}.clubdot{width:34px;height:34px;border-radius:10px;background:#1d4436;display:inline-grid;place-items:center;font-weight:950;color:#7aefaa;margin-right:8px}.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #203e34}.fixture:last-child{border-bottom:0}.fixture .home{text-align:right}.fixture .away{text-align:left}.vs{min-width:80px;text-align:center;padding:7px 9px;border-radius:10px;background:#18352b;font-weight:900}.live{background:#58202a;color:#ffb7bf}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:#9eb7ad;font-weight:800}.field input,.field select{width:100%;border:1px solid #2c5143;background:#0a1e17;color:#fff;padding:12px 13px;border-radius:12px}.tabs{display:none}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:20px}.modal-card{width:min(680px,100%);max-height:86vh;overflow:auto;background:#0c2019;border:1px solid #315244;border-radius:24px;padding:22px;box-shadow:var(--shadow)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.x{border:0;background:#1b342b;color:#fff;width:34px;height:34px;border-radius:10px}.notice{border-left:4px solid var(--green);background:#113124;padding:12px 14px;border-radius:10px;margin:10px 0;color:#dff8e9}.toast{position:fixed;right:22px;bottom:22px;z-index:90;background:#173c2e;border:1px solid #2a664a;border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);font-weight:800;max-width:360px}.toast.err{background:#3a1f20;border-color:#7b3c3e}.card-action{display:flex;flex-direction:column;min-height:210px}.card-action .emoji{font-size:34px}.card-action p{color:var(--muted);line-height:1.5;flex:1}.progress{height:9px;background:#1c382f;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:inherit}.week-switch{display:flex;gap:6px;overflow:auto;padding-bottom:5px}.week-switch button{border:1px solid #2b4c41;background:#0e251e;color:#aac1b8;border-radius:10px;padding:8px 11px;white-space:nowrap}.week-switch button.active{background:#1d4b39;color:#fff;border-color:#3b775d}.mobile-only{display:none}
@media(max-width:980px){.desktop-nav{display:none}.hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.top-user .uname{display:none}.mobile-only{display:block}.tabs{position:fixed;z-index:30;bottom:0;left:0;right:0;display:flex;gap:3px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:rgba(7,20,16,.96);border-top:1px solid #1d3d32;overflow:auto}.tabs button{min-width:72px;border:0;background:transparent;color:#90aca1;border-radius:10px;padding:8px 7px;font-size:10px;font-weight:800}.tabs button.active{background:#1a3c30;color:#fff}.shell{padding:18px 14px 100px}.topbar{height:62px;padding:0 14px}.pitch{min-height:560px;padding:15px 5px}.player-chip{width:min(95px,22vw)}.shirt{width:56px;height:52px}.bench{grid-template-columns:1fr 1fr}.table{font-size:13px}.table th:nth-child(4),.table td:nth-child(4){display:none}}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stat b{font-size:21px}.hero-main{padding:20px}.hero-main h1{font-size:36px}.form-row{grid-template-columns:1fr}.fixture{grid-template-columns:1fr auto 1fr;font-size:12px}.player-chip{width:20vw}.pname{font-size:9px}.pitch-line{gap:3px}.card{padding:15px}.section-head h1{font-size:25px}}
</style>
</head>
<body>
<div id="gate"><div class="gate-card"><div class="brandmark">SN</div><div class="eyebrow">FANTEZİ FUTBOL · WEB</div><h1>SahaNova</h1><p>Takımını kur, haftanı yönet, arkadaşlarınla kapış. En iyi deneyim için oyun tam ekran açılır.</p><button class="primary" id="enterBtn">Tam ekrana geç ve oyna</button><div style="margin-top:13px"><button class="ghost small" id="enterWindow">Pencere modunda devam et</button></div></div></div>
<div class="app hidden" id="app">
<header class="topbar"><div class="logo"><i>SN</i><span>SahaNova</span></div><nav class="desktop-nav" id="nav"></nav><div class="top-user"><span class="pill green" id="weekPill">HF 1</span><div class="avatar" id="avatar">D</div><span class="uname" id="userName">Menajer</span></div></header>
<main class="shell"><div id="view"></div></main><nav class="tabs" id="mobileNav"></nav>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle" style="margin:0"></h2><button class="x" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const tabs=[['home','Ana Sayfa','⌂'],['squad','Takımım','⚽'],['transfer','Transfer','⇄'],['points','Puanlar','★'],['fixtures','Fikstür','▦'],['leagues','Ligler','♜'],['nostra','Nostradamus','◎'],['cards','Kartlar','◆'],['rewards','Ödüller','🏆'],['settings','Ayarlar','⚙']];
let state=null,current='home',week=1,userId=localStorage.getItem('sn-user')||'demo';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(msg,err=false){const t=$('#toast');t.textContent=msg;t.className='toast'+(err?' err':'');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.add('hidden'),3000)}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','x-user-id':userId,...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||(j.errors||[]).join(' ')||'İşlem başarısız.');return j}
async function load(){try{state=await api('/api/state');week=state.user.activeWeek||1;renderChrome();render()}catch(e){$('#view').innerHTML='<div class="empty">Sunucuya bağlanılamadı: '+esc(e.message)+'</div>'}}
function renderChrome(){const html=tabs.map(([id,n,ic])=>`<button class="navbtn ${current===id?'active':''}" data-tab="${id}">${n}</button>`).join('');$('#nav').innerHTML=html;$('#mobileNav').innerHTML=tabs.slice(0,8).map(([id,n,ic])=>`<button class="${current===id?'active':''}" data-tab="${id}"><div style="font-size:16px">${ic}</div>${n}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;renderChrome();render();scrollTo(0,0)});$('#weekPill').textContent='HF '+week;$('#userName').textContent=state.user.displayName;$('#avatar').textContent=(state.user.displayName||'M')[0].toUpperCase()}
function money(v){return Number(v).toFixed(1)+' M₺'}
function statusPill(s){let c=s==='Hazır'?'green':s==='Şüpheli'?'yellow':'red';return `<span class="pill ${c}">${esc(s)}</span>`}
function fixtureText(f,club){if(!f)return '—';return f.home===club?`vs ${f.away}`:`@ ${f.home}`}
function rankChange(){const u=state.user;if(!u.previousRank||!u.overallRank)return '';const d=u.previousRank-u.overallRank;return d>0?`<span class="delta-up">▲ ${d.toLocaleString('tr-TR')}</span>`:d<0?`<span class="delta-down">▼ ${Math.abs(d).toLocaleString('tr-TR')}</span>`:'—'}
function ensureSquadBox(){if(state.squad.length)return '';return `<div class="notice"><b>İlk takımını kurmaya hazırsın.</b><br><span class="muted">Sana dengeli bir başlangıç kadrosu hazırlayabiliriz; sonrasında istediğin her oyuncuyu değiştirebilirsin.</span><div style="margin-top:10px"><button class="primary" onclick="autoSquad()">Otomatik 15 kişilik kadro kur</button></div></div>`}
function render(){if(!state)return;const fn={home:homeView,squad:squadView,transfer:transferView,points:pointsView,fixtures:fixturesView,leagues:leaguesView,nostra:nostraView,cards:cardsView,rewards:rewardsView,settings:settingsView}[current]||homeView;$('#view').innerHTML=fn();bindDynamic()}
function homeView(){const live=state.fixtures.filter(f=>f.week===week&&f.status==='CANLI');const next=state.fixtures.filter(f=>f.week===week).slice(0,5);return `${ensureSquadBox()}<div class="hero"><section class="hero-main"><div class="eyebrow">HAFTA ${week}</div><h1>${esc(state.user.teamName)}</h1><p>Kararlarını maç başlamadan ver. Form, fikstür zorluğu, oyuncu durumu ve bütçeyi birlikte düşün.</p><div class="hero-actions"><button class="primary" data-go="squad">Takımımı düzenle</button><button class="ghost" data-go="transfer">Transfer yap</button></div></section><section class="hero-side card"><div class="eyebrow">SONRAKİ KİLİT</div><h3>Hafta ${week} kadro kilidi</h3><div class="deadline">Cumartesi · 17:45</div><p class="muted">Kaptanını ve ilk 11’ini son kez kontrol et.</p></section></div><div class="stats"><div class="stat card"><span>Toplam Puan</span><b>${state.user.points}</b></div><div class="stat card"><span>Hafta Puanı</span><b>${state.user.gameweekPoints}</b></div><div class="stat card"><span>Genel Sıra</span><b>#${Number(state.user.overallRank||0).toLocaleString('tr-TR')}</b><small>${rankChange()}</small></div><div class="stat card"><span>Bankada</span><b>${money(state.user.bank)}</b></div></div><div class="grid2"><section class="card"><div class="section-head"><h2>Maç Merkezi</h2><span class="pill ${live.length?'red':'green'}">${live.length?live.length+' canlı':'Program'}</span></div>${next.map(f=>fixtureRow(f)).join('')}</section><section class="card"><h2>Menajer Kontrolü</h2><div class="list"><div class="row"><div class="row-main"><b>Serbest transfer</b><small>Ek transferler -4 puan</small></div><span class="score">${state.user.freeTransfers}</span></div><div class="row"><div class="row-main"><b>Aktif kart</b><small>Bir haftada yalnızca bir kart</small></div><span class="pill ${state.activeCard?'yellow':'green'}">${state.activeCard?cardName(state.activeCard):'Yok'}</span></div><div class="row"><div class="row-main"><b>Diziliş</b><small>İlk 11 yapısı</small></div><span class="score">${esc(state.user.formation)}</span></div></div></section></div>`}
function fixtureRow(f){const live=f.status==='CANLI';const center=live?`${f.homeScore} - ${f.awayScore}<br><small>${f.minute}'</small>`:new Date(f.kickoff).toLocaleString('tr-TR',{weekday:'short',hour:'2-digit',minute:'2-digit'});return `<div class="fixture"><div class="home"><b>${esc(f.home)}</b></div><div class="vs ${live?'live':''}">${center}</div><div class="away"><b>${esc(f.away)}</b></div></div>`}
function squadView(){if(!state.squad.length)return `<div class="section-head"><h1>Takımım</h1></div>${ensureSquadBox()}`;const starters=state.squad.filter(x=>x.isStarting);const by=p=>starters.filter(x=>x.player.position===p);const lines=['GK','DEF','MID','FWD'];return `<div class="section-head"><div><div class="eyebrow">KADRO YÖNETİMİ</div><h1>Takımım</h1></div><div class="toolbar"><select id="formationSelect" class="ghost">${Object.keys(state.formations).map(f=>`<option ${f===state.user.formation?'selected':''}>${f}</option>`).join('')}</select><button class="primary" id="saveLineup">Dizilişi uygula</button></div></div><div class="grid2"><div><div class="pitch">${lines.map(pos=>`<div class="pitch-line">${by(pos).map(x=>playerChip(x)).join('')}</div>`).join('')}</div><div class="bench">${state.squad.filter(x=>!x.isStarting).map(x=>`<div class="row"><span class="bench-badge">YEDEK</span><div class="row-main"><b>${esc(x.player.name)}</b><small>${x.player.position} · ${x.player.clubCode}</small></div><b>${x.player.gameweekPoints}</b></div>`).join('')}</div></div><div><section class="card"><h2>Kaptanlık</h2><p class="muted">Bir oyuncuya dokunarak kaptan veya kaptan yardımcısı yap.</p><div class="list">${starters.map(x=>`<button class="row" style="color:inherit;text-align:left;width:100%" onclick="captainModal('${x.player.id}')"><div class="clubdot">${x.player.clubCode}</div><div class="row-main"><b>${esc(x.player.name)} ${x.isCaptain?'(K)':x.isVice?'(Y)':''}</b><small>${x.player.position} · ${money(x.player.price)} · Form ${x.player.form}</small></div>${statusPill(x.player.status)}</button>`).join('')}</div></section><section class="card" style="margin-top:16px"><h2>Kadro Kuralları</h2><div class="muted" style="line-height:1.7">15 oyuncu: 2 kaleci, 5 defans, 5 orta saha, 3 forvet.<br>Bir kulüpten en fazla 3 oyuncu.<br>İlk 11 seçilen dizilişe uymalı.<br>Kaptan normal haftada 2× puan getirir.</div></section></div></div>`}
function playerChip(x){return `<button class="player-chip ${x.isCaptain?'captain':''}" onclick="captainModal('${x.player.id}')"><div class="shirt">${x.player.clubCode}</div><div class="pname">${esc(x.player.name)} ${x.isCaptain?'Ⓚ':x.isVice?'Ⓨ':''}</div><div class="pmeta">${x.player.gameweekPoints}p · ${money(x.player.price)}</div></button>`}
function transferView(){if(!state.squad.length)return `<div class="section-head"><h1>Transfer</h1></div>${ensureSquadBox()}`;return `<div class="section-head"><div><div class="eyebrow">PİYASA</div><h1>Transfer</h1></div><span class="pill green">${state.user.freeTransfers} serbest · ${money(state.user.bank)} banka</span></div><div class="card"><table class="table"><thead><tr><th>Oyuncu</th><th>Durum</th><th>Form</th><th>Sonraki</th><th>Fiyat</th><th></th></tr></thead><tbody>${state.squad.map(x=>`<tr><td><span class="clubdot">${x.player.clubCode}</span><b>${esc(x.player.name)}</b><br><small class="muted">${x.player.position} · ${x.player.club}</small></td><td>${statusPill(x.player.status)}</td><td><b>${x.player.form}</b></td><td>${esc(fixtureText(x.player.nextFixture,x.player.club))}</td><td class="money">${money(x.player.price)}</td><td><button class="ghost small" onclick="transferModal('${x.player.id}')">Değiştir</button></td></tr>`).join('')}</tbody></table></div>`}
function pointsView(){if(!state.squad.length)return `<div class="section-head"><h1>Puanlar</h1></div>${ensureSquadBox()}`;const active=state.squad.filter(x=>x.isStarting||state.activeCard==='benchBoost');return `<div class="section-head"><div><div class="eyebrow">HAFTA ${week}</div><h1>Puanlar</h1></div><span class="score">${state.user.gameweekPoints} P</span></div><div class="grid2"><div class="card"><h2>Oyuncu puanları</h2><div class="list">${active.sort((a,b)=>b.player.gameweekPoints-a.player.gameweekPoints).map(x=>`<div class="row"><div class="clubdot">${x.player.clubCode}</div><div class="row-main"><b>${esc(x.player.name)} ${x.isCaptain?'Ⓚ':x.isVice?'Ⓨ':''}</b><small>${x.player.club} · ${x.player.position}</small></div><span class="score">${x.player.gameweekPoints*(x.isCaptain?(state.activeCard==='quadrupleCaptain'?4:state.activeCard==='tripleCaptain'?3:2):1)}</span></div>`).join('')}</div></div><div class="card"><h2>Puanlama özeti</h2><p class="muted" style="line-height:1.7">Dakika, gol, asist, gol yememe, kaleci kurtarışları, penaltı olayları, kartlar, kendi kalesine gol ve bonus puanları oyun motorunda desteklenir. Kaptan çarpanı ve aktif strateji kartı sunucuda hesaplanır.</p><div class="notice">Canlı skor ekranı arka planda düzenli yenilenir.</div></div></div>`}
function fixturesView(){const weeks=[...new Set(state.fixtures.map(x=>x.week))];const fs=state.fixtures.filter(x=>x.week===week);return `<div class="section-head"><div><div class="eyebrow">MAÇ TAKVİMİ</div><h1>Fikstür</h1></div></div><div class="week-switch">${weeks.map(w=>`<button class="${w===week?'active':''}" onclick="week=${w};render()">Hafta ${w}</button>`).join('')}</div><section class="card" style="margin-top:14px">${fs.map(f=>fixtureRow(f)).join('')}</section>`}
function leaguesView(){return `<div class="section-head"><div><div class="eyebrow">REKABET</div><h1>Ligler</h1></div></div><div class="grid2"><div>${state.leagues.map(l=>`<section class="card" style="margin-bottom:14px"><div class="section-head"><div><h2>${esc(l.name)}</h2><span class="pill">${l.type==='global'?'Genel Lig':'Kod '+esc(l.code)}</span></div></div><table class="table"><thead><tr><th>#</th><th>Takım</th><th>Puan</th></tr></thead><tbody>${l.table.map(r=>`<tr><td class="rank">${r.rank}</td><td><b>${esc(r.teamName)}</b><br><small class="muted">${esc(r.displayName)}</small></td><td class="score">${r.points}</td></tr>`).join('')}</tbody></table></section>`).join('')}</div><div><section class="card"><h2>Özel lig oluştur</h2><div class="field"><label>Lig adı</label><input id="leagueName" maxlength="48" placeholder="Örn. Mahalle Şampiyonları"></div><button class="primary" id="createLeague">Lig oluştur</button></section><section class="card" style="margin-top:14px"><h2>Davet koduyla katıl</h2><div class="field"><label>Lig kodu</label><input id="leagueCode" maxlength="16" placeholder="ABC123"></div><button class="ghost" id="joinLeague">Lige katıl</button></section></div></div>`}
function nostraView(){const fs=state.fixtures.filter(f=>f.week===week);return `<div class="section-head"><div><div class="eyebrow">SKOR TAHMİNİ</div><h1>Nostradamus</h1></div><span class="pill yellow">Doğru skor bonusu</span></div><div class="card"><p class="muted">Maç başlamadan skor tahminini kaydet. Canlı veya bitmiş maçlarda tahmin kilitlenir.</p>${fs.map(f=>{const p=state.predictions[f.id]||{};const locked=f.status!=='PROGRAM';return `<div class="fixture"><div class="home"><b>${esc(f.home)}</b></div><div style="display:flex;gap:6px;align-items:center"><input ${locked?'disabled':''} aria-label="Ev sahibi skoru" id="ph-${f.id}" value="${p.home??''}" inputmode="numeric" style="width:48px;text-align:center;border:1px solid #345449;background:#0b2019;color:#fff;border-radius:8px;padding:9px"><b>-</b><input ${locked?'disabled':''} aria-label="Deplasman skoru" id="pa-${f.id}" value="${p.away??''}" inputmode="numeric" style="width:48px;text-align:center;border:1px solid #345449;background:#0b2019;color:#fff;border-radius:8px;padding:9px"><button ${locked?'disabled':''} class="ghost small" onclick="savePrediction('${f.id}')">Kaydet</button></div><div class="away"><b>${esc(f.away)}</b></div></div>`}).join('')}</div>`}
const cardInfo={tripleCaptain:['Üçlü Kaptan','Kaptanın bu hafta 3× puan getirir.','3×'],quadrupleCaptain:['Dörtlü Kaptan','Kaptanın bu hafta 4× puan getirir.','4×'],benchBoost:['Yedek Gücü','Yedek oyuncuların da haftalık puana dahil edilir.','+'],unlimitedBudget:['Sınırsız Bütçe','Bu hafta kadro bütçe sınırı kaldırılır.','∞'],attack:['Hücum!','Forvetlerinin pozitif puanına hücum bonusu eklenir.','⚡']};
function cardName(k){return cardInfo[k]?.[0]||k}
function cardsView(){return `<div class="section-head"><div><div class="eyebrow">STRATEJİ</div><h1>Kartlar</h1></div><span class="pill ${state.activeCard?'yellow':'green'}">${state.activeCard?'Aktif: '+cardName(state.activeCard):'Bu hafta kart seçilmedi'}</span></div><div class="grid3">${Object.entries(state.user.cards||{}).map(([k,n])=>{const i=cardInfo[k];return `<div class="card card-action"><div class="emoji">${i[2]}</div><h2>${i[0]}</h2><p>${i[1]}</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="pill">${n} adet</span><button class="primary small" ${!n||state.activeCard?'disabled style="opacity:.45"':''} onclick="useCard('${k}')">Kullan</button></div></div>`}).join('')}</div>`}
function rewardsView(){return `<div class="section-head"><div><div class="eyebrow">BAŞARIMLAR</div><h1>Ödüller</h1></div></div><div class="grid3">${state.rewards.map(r=>{const pct=Math.min(100,Math.round((r.progress/r.target)*100));return `<div class="card"><div style="font-size:36px">${r.icon}</div><h2>${esc(r.title)}</h2><p class="muted">${esc(r.description)}</p><div class="progress"><i style="width:${pct}%"></i></div><div style="display:flex;justify-content:space-between;margin-top:8px"><small class="muted">${r.progress} / ${r.target}</small><b>${pct}%</b></div></div>`}).join('')}</div>`}
function settingsView(){return `<div class="section-head"><div><div class="eyebrow">HESAP</div><h1>Ayarlar</h1></div></div><div class="grid2"><section class="card"><h2>Profil</h2><div class="field"><label>Menajer adı</label><input id="displayName" maxlength="32" value="${esc(state.user.displayName)}"></div><div class="field"><label>Takım adı</label><input id="teamName" maxlength="40" value="${esc(state.user.teamName)}"></div><button class="primary" id="saveProfile">Kaydet</button></section><section class="card"><h2>Görünüm</h2><p class="muted">SahaNova mobil ve masaüstünde çalışır. Tam ekran deneyimini istediğin zaman açabilirsin.</p><button class="ghost" id="fullscreenBtn">Tam ekrana geç</button><h3 style="margin-top:24px">Veri oturumu</h3><p class="muted">Bu demo kullanıcı kimliği: <b>${esc(userId)}</b></p></section></div>`}
function bindDynamic(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=b.dataset.go;renderChrome();render()});const sp=$('#saveProfile');if(sp)sp.onclick=saveProfile;const cl=$('#createLeague');if(cl)cl.onclick=createLeague;const jl=$('#joinLeague');if(jl)jl.onclick=joinLeague;const sl=$('#saveLineup');if(sl)sl.onclick=saveFormation;const fb=$('#fullscreenBtn');if(fb)fb.onclick=fullScreen}
async function autoSquad(){try{const counts={GK:2,DEF:5,MID:5,FWD:3},club={};let picks=[];for(const pos of Object.keys(counts)){const pool=state.players.filter(p=>p.position===pos&&p.status!=='Sakat').sort((a,b)=>a.price-b.price||b.form-a.form);for(const p of pool){if(picks.filter(x=>x.position===pos).length>=counts[pos])break;if((club[p.club]||0)>=3)continue;picks.push(p);club[p.club]=(club[p.club]||0)+1}}await api('/api/squad',{method:'POST',body:JSON.stringify({playerIds:picks.map(p=>p.id),formation:'4-4-2'})});toast('Başlangıç kadron hazır.');await load();current='squad';renderChrome();render()}catch(e){toast(e.message,true)}}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
function captainModal(id){const e=state.squad.find(x=>x.player.id===id);if(!e||!e.isStarting)return;modal(e.player.name,`<div class="row"><div class="clubdot">${e.player.clubCode}</div><div class="row-main"><b>${esc(e.player.club)}</b><small>${e.player.position} · ${money(e.player.price)} · ${e.player.gameweekPoints} puan</small></div>${statusPill(e.player.status)}</div><div class="hero-actions"><button class="primary" onclick="setCaptain('${id}',false)">Kaptan yap</button><button class="ghost" onclick="setCaptain('${id}',true)">Kaptan yardımcısı yap</button></div>`)}
async function setCaptain(id,vice){const starters=state.squad.filter(x=>x.isStarting).map(x=>x.player.id);let cap=state.squad.find(x=>x.isCaptain)?.player.id,vi=state.squad.find(x=>x.isVice)?.player.id;if(vice){vi=id;if(cap===id)cap=starters.find(x=>x!==id)}else{cap=id;if(vi===id)vi=starters.find(x=>x!==id)}try{await api('/api/lineup',{method:'POST',body:JSON.stringify({starterIds:starters,formation:state.user.formation,captainId:cap,viceId:vi})});closeModal();toast(vice?'Kaptan yardımcısı güncellendi.':'Kaptan güncellendi.');await load()}catch(e){toast(e.message,true)}}
async function saveFormation(){const f=$('#formationSelect').value,rule=state.formations[f],starters=[];for(const pos of ['GK','DEF','MID','FWD']){const list=state.squad.filter(x=>x.player.position===pos).sort((a,b)=>b.player.form-a.player.form);starters.push(...list.slice(0,rule[pos]).map(x=>x.player.id))}let cap=state.squad.find(x=>x.isCaptain&&starters.includes(x.player.id))?.player.id||starters[1],vice=state.squad.find(x=>x.isVice&&starters.includes(x.player.id))?.player.id||starters.find(x=>x!==cap);try{await api('/api/lineup',{method:'POST',body:JSON.stringify({starterIds:starters,formation:f,captainId:cap,viceId:vice})});toast('Diziliş kaydedildi.');await load()}catch(e){toast(e.message,true)}}
function transferModal(outId){const out=state.squad.find(x=>x.player.id===outId)?.player;if(!out)return;const owned=new Set(state.squad.map(x=>x.player.id));const cand=state.players.filter(p=>p.position===out.position&&!owned.has(p.id)).sort((a,b)=>b.form-a.form).slice(0,40);modal('Transfer · '+out.name,`<p class="muted">Aynı pozisyondan yeni oyuncunu seç. Bütçe ve kulüp sınırı sunucuda tekrar kontrol edilir.</p><div class="list">${cand.map(p=>`<button class="row" style="width:100%;color:inherit;text-align:left" onclick="doTransfer('${outId}','${p.id}')"><div class="clubdot">${p.clubCode}</div><div class="row-main"><b>${esc(p.name)}</b><small>${p.club} · Form ${p.form} · Sahiplik %${p.ownership}</small></div><div style="text-align:right">${statusPill(p.status)}<div class="money" style="margin-top:5px">${money(p.price)}</div></div></button>`).join('')}</div>`)}
async function doTransfer(outId,inId){try{const r=await api('/api/transfers',{method:'POST',body:JSON.stringify({outId,inId})});closeModal();toast(r.cost?`Transfer tamamlandı: -${r.cost} puan.`:'Serbest transfer tamamlandı.');await load()}catch(e){toast(e.message,true)}}
async function savePrediction(id){const h=Number($('#ph-'+id).value),a=Number($('#pa-'+id).value);try{await api('/api/predictions',{method:'POST',body:JSON.stringify({fixtureId:id,home:h,away:a})});toast('Tahmin kaydedildi.');await load()}catch(e){toast(e.message,true)}}
async function useCard(k){if(!confirm(cardName(k)+' kartını bu hafta kullanmak istiyor musun?'))return;try{await api('/api/cards/use',{method:'POST',body:JSON.stringify({card:k})});toast(cardName(k)+' aktif edildi.');await load()}catch(e){toast(e.message,true)}}
async function createLeague(){const name=$('#leagueName').value.trim();try{const r=await api('/api/leagues',{method:'POST',body:JSON.stringify({name})});toast('Lig oluşturuldu. Davet kodu: '+r.league.code);await load()}catch(e){toast(e.message,true)}}
async function joinLeague(){const code=$('#leagueCode').value.trim();try{await api('/api/leagues/join',{method:'POST',body:JSON.stringify({code})});toast('Lige katıldın.');await load()}catch(e){toast(e.message,true)}}
async function saveProfile(){try{await api('/api/profile',{method:'POST',body:JSON.stringify({displayName:$('#displayName').value,teamName:$('#teamName').value})});toast('Profil güncellendi.');await load()}catch(e){toast(e.message,true)}}
async function fullScreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch{} }
async function enter(fs){if(fs)await fullScreen();localStorage.setItem('sn-entered','1');$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');await load()}
$('#enterBtn').onclick=()=>enter(true);$('#enterWindow').onclick=()=>enter(false);if(localStorage.getItem('sn-entered')==='1'){enter(false)}
setInterval(()=>{if(state&&document.visibilityState==='visible')load()},30000);
window.closeModal=closeModal;
</script>
</body></html>
