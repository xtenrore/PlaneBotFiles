name: SahaNova CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: JavaScript syntax checks
        run: |
          node --check server-auth.js
          node --check server-v2.js
          node --check server.js
          node --check lib/game.js
          node --check lib/store.js
          node --check lib/competitions.js
          node --check lib/official-roster-patch.js
          node --check public/app.js
          node --check public/real-data-patch.js
          node --check public/feature-patch.js
          node --check public/free-platform.js
          node --check public/auth-ui.js
      - run: npm test
